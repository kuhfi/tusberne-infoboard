<!DOCTYPE html>
<html lang="de">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root{--blue:#0055a5;--navy:#063f78;--ink:#142d44;--muted:#55718a;--bg:#f4f8fc;--card:#fff;--line:#cadeef;--soft:#eaf3fb;--warn:#875600;--red:#a82d2d;--green:#126b47}
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth}body{margin:0;font:15px/1.46 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
    .shell{max-width:920px;margin:auto;padding:15px 13px 94px}header{display:flex;gap:13px;align-items:center;margin:8px 0 22px}
    header img{width:57px;height:57px;object-fit:contain;flex:none}h1{font-size:clamp(24px,5vw,36px);line-height:1.1;color:var(--navy);margin:0}
    h2{font-size:19px;color:var(--navy);margin:0 0 5px}p{margin:4px 0 8px}.sub{color:var(--muted);font-size:13px}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 12px #123b6208;margin-bottom:14px}
    .status{padding:12px 14px;border-radius:11px;background:var(--soft);color:var(--navy);font-weight:650}
    .status.warn{background:#fff6e5;color:var(--warn)}.status.bad{background:#fff0ef;color:var(--red)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .tag{display:inline-flex;align-items:center;gap:5px;font-weight:720;font-size:12px;padding:5px 9px;border-radius:100px;background:#edf3fa;color:var(--navy)}
    .tag.warn{background:#fff1d4;color:#805100}.tag.ok{background:#e4f6eb;color:#126b47}
    .nav{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .nav-title{text-align:center;flex:1;font-size:18px;font-weight:800;color:var(--navy)}
    .switches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
    button,.btn{appearance:none;cursor:pointer;border:1px solid #bad0e4;border-radius:10px;font:700 14px/1.2 inherit;padding:11px 12px;color:var(--navy);background:#fff;min-height:44px}
    button:disabled{opacity:.46;cursor:default}.switches button{min-height:60px;font:700 13px/1.3 system-ui}
    button.selected{background:var(--blue);color:#fff;border-color:var(--blue)}
    button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button.danger{color:var(--red);border-color:#efc4c4}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e5a735;outline-offset:2px}
    input,select{font:inherit;min-width:0;border:1px solid #aac7dd;border-radius:10px;background:#fff;min-height:42px;padding:9px;color:var(--ink);width:100%}
    label{display:block;color:var(--muted);font-size:12px;font-weight:780;margin-bottom:5px}
    .games{display:grid;gap:12px}.day{font-weight:820;color:var(--navy);padding:8px 1px 0;border-bottom:1px solid var(--line)}
    .game-title{display:flex;gap:12px;align-items:flex-start}.time{font-weight:870;font-size:19px;color:var(--navy);min-width:63px}
    .clubs{flex:1;min-width:0;overflow-wrap:anywhere}.clubs strong{color:var(--blue)}.clubs span{display:block}.meta{font-size:12px;color:var(--muted);margin-top:7px}
    .cabins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}
    .cabins label{text-align:center}.static{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:9px;text-align:center;font-size:18px;font-weight:850;color:var(--navy);min-height:44px}
    .game-form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.game-form .wide{grid-column:span 2}
    .sticky{position:fixed;z-index:5;bottom:0;left:0;right:0;background:linear-gradient(transparent,#f4f8fc 13%);padding:15px 12px max(15px,env(safe-area-inset-bottom))}
    .sticky .inner{max-width:894px;display:flex;gap:9px;margin:auto}.sticky button.primary{flex:1}
    .alert{background:#fff8e8;border:1px solid #efce90;border-radius:10px;padding:11px;color:#715000;font-size:13px;margin:10px 0}
    .slogan{text-align:center;color:var(--navy);letter-spacing:.04em;font-weight:850;font-size:12px;margin-top:23px}
    .loading{display:flex;align-items:center;gap:12px}.dot{width:16px;height:16px;border:3px solid #b9d8ee;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:560px){.shell{padding:12px 11px 94px}header img{width:49px;height:49px}.switches{gap:5px}.switches button{font-size:12px;padding:7px 5px}.card{padding:13px}.game-form{gap:7px}}
  </style>
</head>
<body>
<main class="shell">
  <header>
    <img alt="Vereinslogo tus BERNE" src="https://kuhfi.github.io/tusberne-infoboard/assets/tus-berne-logo.svg">
    <div><div class="sub">Fußballabteilung · Verwaltung</div><h1>Kabinenbelegung</h1><div class="sub">Manuelle Wochenplanung</div></div>
  </header>
  <div id="notice" class="status loading"><span class="dot"></span> Kabinenplan wird geladen …</div>
  <section id="content" hidden>
    <div class="card">
      <div class="row"><h2 id="weekTitle">Aktuelle Woche</h2><span id="publishedStatus" class="tag">Datenstand</span></div>
      <div id="sourceStatus" class="sub"></div>
      <div class="switches" id="modeButtons">
        <button type="button" data-mode="automatic">Automatik</button>
        <button type="button" data-mode="partial">Einzelkorrekturen</button>
        <button type="button" data-mode="locked">Woche sperren</button>
      </div>
      <p class="sub" id="modeHint" style="margin-top:9px"></p>
    </div>
    <div id="staleAlert" class="alert" hidden></div>
    <div class="row" style="margin:13px 2px"><h2>Heimspiele</h2><span class="sub" id="gameCount"></span></div>
    <div id="games" class="games"></div>
    <div id="addWrap" style="display:none;margin:15px 0"><button type="button" id="addGame">+ Spiel zur Woche hinzufügen</button></div>
    <div class="slogan">EINMAL BERNE IMMER BERNE</div>
  </section>
</main>
<footer class="sticky" id="actions" hidden><div class="inner"><button type="button" id="reload">Neu laden</button><button type="button" class="primary" id="save">Änderungen speichern</button></div></footer>
<script>
'use strict';
let initial=null, mode='automatic', draftChanges={}, draftLocked=[], busy=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const fmt=date=>/^\d{4}-\d{2}-\d{2}$/.test(date||'')?date.slice(8)+'.'+date.slice(5,7)+'.'+date.slice(0,4):String(date||'');
const fields=['home_cabin','guest_cabin','sr_cabin'];
const labels={home_cabin:'Heim',guest_cabin:'Gast',sr_cabin:'SR'};
const options={home_cabin:['','1','2','3','4'],guest_cabin:['','1','2','3','4'],sr_cabin:['','SR1','SR2']};
function report(message,kind=''){ $('notice').className='status '+kind; $('notice').textContent=message;}
function clone(v){return JSON.parse(JSON.stringify(v));}
const gameFields=['date','time','kind','league','home','away','home_cabin','guest_cabin','sr_cabin','festival'];
function stripGames(games){return (games||[]).map(g=>Object.fromEntries(gameFields.map(f=>[f,f==='festival'?Boolean(g[f]):String(g[f]??'')])));}
function stateFromServer(data){
  initial=data;mode=data.mode;draftChanges=clone(data.changes||{});draftLocked=stripGames(data.lockedGames||[]);
  if(data.mode!=='locked' && !draftLocked.length) draftLocked=stripGames(data.effectiveGames||[]);
  busy=false;
  $('content').hidden=false;$('actions').hidden=!data.editable;
  report('Google-Tabelle: '+(data.revision>0?'Version '+data.revision+' gespeichert':'Noch keine manuellen Änderungen'),'');
  draw();
}
function load(){busy=true;report('Daten werden geladen …');$('reload').disabled=true;$('save').disabled=true;
  if(!window.google?.script?.run){report('Diese Verwaltungsseite muss als Google Apps Script Web-App geöffnet werden.','bad');return;}
  google.script.run.withSuccessHandler(stateFromServer).withFailureHandler(e=>{busy=false;report(e.message||String(e),'bad');$('reload').disabled=false;}).apiLoad();
}
function currentGames(){
  if(mode==='locked')return draftLocked;
  const base=initial.games||[];
  if(mode!=='partial')return base;
  return base.map((g,i)=>Object.assign({},g,draftChanges[initial.gameIds[i]]||{}));
}
function showModes(){
  document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('selected',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode));});
  $('modeHint').textContent=mode==='automatic'?'Die automatische Berechnung gilt. Mit Speichern entfernst du alle Korrekturen dieser Woche.':mode==='partial'?'Nur ausdrücklich geänderte Kabinen bleiben manuell festgesetzt. Andere Felder bleiben automatisch.':'Der komplette Wochenplan wird als feste Version gespeichert. Auch neue Ansetzungen gelangen erst nach Entsperren in den Plan.';
  $('save').textContent=mode==='automatic'?'Automatik wiederherstellen':mode==='partial'?'Einzelkorrekturen speichern':'Woche sperren und speichern';
  $('addWrap').style.display=mode==='locked'?'block':'none';
}
function cabinControl(game,field,i){
  const value=String(game[field]||'');
  if(mode==='automatic')return '<div class="static">'+esc(value||'–')+'</div>';
  return '<select data-pos="'+i+'" data-field="'+field+'" aria-label="'+labels[field]+' Kabine">'+options[field].map(v=>'<option value="'+v+'"'+(v===value?' selected':'')+'>'+esc(v||'–')+'</option>').join('')+'</select>';
}
function textField(label,field,value,i,wide=false){return '<div class="'+(wide?'wide':'')+'"><label>'+label+'</label><input data-pos="'+i+'" data-field="'+field+'" maxlength="160" value="'+esc(value)+'"></div>';}
function gameCard(game,i){
  const isChanged=mode==='locked'||(mode==='partial'&&Boolean(draftChanges[initial.gameIds[i]]));
  let form='';
  if(mode==='locked'){
    form='<div class="game-form">'+textField('Datum (JJJJ-MM-TT)','date',game.date,i)+textField('Anstoßzeit (HH:MM)','time',game.time,i)+textField('Heimteam','home',game.home,i,true)+textField('Gastteam','away',game.away,i,true)+textField('Spielart','kind',game.kind,i)+textField('Staffel','league',game.league,i)+'</div>';
  }
  return '<article class="card" data-card="'+i+'"><div class="game-title"><div class="time">'+esc(game.time)+'</div><div class="clubs"><strong>'+esc(game.home)+'</strong><span>'+esc(game.away)+'</span><div class="meta">'+esc([game.kind,game.league].filter(Boolean).join(' · '))+'</div></div>'+(isChanged?'<span class="tag warn">Manuell</span>':'')+'</div>'+
    form+'<div class="cabins">'+fields.map(f=>'<div><label>'+labels[f]+'</label>'+cabinControl(game,f,i)+'</div>').join('')+'</div>'+
    (mode==='locked'?'<div style="margin-top:10px" class="row"><label style="margin:0"><input type="checkbox" data-pos="'+i+'" data-field="festival"'+(game.festival?' checked':'')+' style="width:auto;min-height:0;margin-right:6px">Turnier</label><button type="button" class="danger" data-remove="'+i+'">Spiel entfernen</button></div>':'')+'</article>';
}
function dayOf(iso){const d=new Date(iso+'T12:00:00Z');return new Intl.DateTimeFormat('de-DE',{weekday:'long',timeZone:'UTC'}).format(d);}
function draw(){if(!initial)return;
  const p=initial.period;$('weekTitle').textContent=p?'KW '+isoWeek_(p.start)+' · '+fmt(p.start)+' – '+fmt(p.end):'Aktuelle Woche: keine Quelldaten';
  $('sourceStatus').textContent='Automatische Daten: '+(initial.sourceGeneratedAt?new Date(initial.sourceGeneratedAt).toLocaleString('de-DE',{timeZone:'Europe/Berlin'}):'kein Zeitstempel');
  const status=initial.published;
  $('publishedStatus').textContent=status?.state==='published'?'Auf Infoboard veröffentlicht':status?.state==='pending'?'Veröffentlichung ausstehend':'Infoboard-Status nicht abrufbar';
  $('publishedStatus').className='tag '+(status?.state==='published'?'ok':'warn');
  const old=Date.now()-Date.parse(initial.sourceGeneratedAt||'')>7*86400000 || Number.isNaN(Date.parse(initial.sourceGeneratedAt||''));
  $('staleAlert').hidden=Boolean(initial.editable)&&!old;
  $('staleAlert').textContent=!initial.editable?'Die aktuelle Woche fehlt in den automatischen Quelldaten. Änderungen sind gesperrt.':old?'Die automatischen Spieldaten sind älter als sieben Tage. Bitte vor dem Speichern die tatsächlichen Ansetzungen prüfen.':'';
  showModes();
  const games=currentGames(), sorted=games.map((g,i)=>({g,i})).sort((a,b)=>a.g.date.localeCompare(b.g.date)||a.g.time.localeCompare(b.g.time));
  $('gameCount').textContent=games.length+' Spiele';
  $('games').innerHTML=sorted.length?sorted.map(({g,i},j)=>((j===0||sorted[j-1].g.date!==g.date)?'<div class="day">'+esc(dayOf(g.date))+' · '+fmt(g.date)+'</div>':'')+gameCard(g,i)).join(''):'<div class="card">Keine Heimspiele für diese Woche eingetragen.</div>';
  $('save').disabled=!initial.editable || busy;$('reload').disabled=busy;
  document.querySelectorAll('[data-mode]').forEach(b=>{b.disabled=busy||!initial.editable;});
}
function isoWeek_(s){const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+3-(d.getUTCDay()+6)%7);const y=d.getUTCFullYear();return 1+Math.round((d-new Date(Date.UTC(y,0,4)-((new Date(Date.UTC(y,0,4)).getUTCDay()+6)%7)*86400000))/604800000);}
$('modeButtons').addEventListener('click',e=>{
  const b=e.target.closest('button[data-mode]');if(!b||busy)return;
  const prev=mode;mode=b.dataset.mode;
  if(mode==='locked'&&prev!=='locked')draftLocked=stripGames(currentGamesFor_(prev));
  draw();
});
function currentGamesFor_(which){return which==='partial'?initial.games.map((g,i)=>Object.assign({},g,draftChanges[initial.gameIds[i]]||{})):which==='locked'?draftLocked:initial.games;}
$('games').addEventListener('change',e=>{
  const el=e.target,field=el.dataset.field, pos=Number(el.dataset.pos);if(!field||!Number.isInteger(pos))return;
  if(mode==='partial'){
    const key=initial.gameIds[pos],original=initial.games[pos]?.[field];if(!key)return;
    if(el.value===original){if(draftChanges[key]){delete draftChanges[key][field];if(!Object.keys(draftChanges[key]).length)delete draftChanges[key];}}
    else{draftChanges[key]=draftChanges[key]||{};draftChanges[key][field]=el.value;}
  } else if(mode==='locked'&&draftLocked[pos]){draftLocked[pos][field]=field==='festival'?el.checked:el.value;}
  draw();
});
// Important: mobile input text is committed only on change/blur, not on each keystroke.
$('games').addEventListener('click',e=>{
  const btn=e.target.closest('[data-remove]');if(!btn||mode!=='locked')return;
  draftLocked.splice(Number(btn.dataset.remove),1);draw();
});
$('addGame').addEventListener('click',()=>{
  if(!initial.period||mode!=='locked')return;
  draftLocked.push({date:initial.period.start,time:'12:00',kind:'Freundschaftsspiel',league:'',home:'tus BERNE',away:'',home_cabin:'',guest_cabin:'',sr_cabin:'',festival:false});
  draw();const all=document.querySelectorAll('[data-card]');all[all.length-1]?.scrollIntoView({behavior:'smooth',block:'center'});
});
$('reload').addEventListener('click',()=>{if(!busy)load();});
$('save').addEventListener('click',()=>{
  if(!initial?.editable || busy)return;
  if(mode==='automatic'&&!confirm('Alle manuellen Korrekturen der aktuellen Woche aufheben und zur Automatik zurückkehren?'))return;
  if(mode==='locked'&&!confirm('Den vollständigen Wochenplan sperren? Neu angesetzte Spiele werden danach nicht automatisch übernommen.'))return;
  busy=true;draw();report('Änderungen werden in Google gespeichert …');
  const payload={week:initial.week,revision:initial.revision,sourceHash:initial.sourceHash,mode:mode,changes:draftChanges,games:draftLocked};
  google.script.run.withSuccessHandler(result=>{
    report('Gespeichert in Google (Version '+result.revision+'). Veröffentlichung auf dem Infoboard kann noch ausstehen.');load();
  }).withFailureHandler(error=>{busy=false;report('Speichern fehlgeschlagen: '+(error.message||String(error)),'bad');draw();}).apiSave(payload);
});
load();
</script>
</body>
</html>
