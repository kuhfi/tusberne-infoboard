name: Test public content sync
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cabins_overrides.py'
      - 'scripts/pi_cabins_admin.py'
      - 'scripts/kabinen_admin.html'
      - 'scripts/pi_cabins_export.py'
      - 'apps_script/**'
      - 'scripts/pi_google_cabins_sync.py'
      - 'tests/test_google_cabins_sync.py'
      - 'tests/test_apps_script.js'
      - 'deploy/systemd/berne-cabins-google-sync.service'
      - 'deploy/systemd/berne-cabins-google-sync.timer'
      - 'tests/test_cabins_manual.py'
      - 'files/kabinen-belegungsplan.html'
      - 'scripts/pi_public_publish.sh'
      - '.github/workflows/test_public_sync.yml'
  pull_request:
    paths:
      - 'files/mannschaften.html'
      - 'data/content.json'
      - 'files/kabinen-belegungsplan.html'
      - 'tests/test_news_order_cabins_week.py'
      - 'scripts/pi_public_sync.py'
      - 'scripts/pi_public_publish.sh'
      - 'scripts/pi_training_export.py'
      - 'scripts/pi_teams_export.py'
      - 'scripts/pi_drive_attest.py'
      - 'tests/test_pi_public_sync.py'
      - 'tests/test_pi_pdf_publication.py'
      - 'tests/test_pi_public_publish.py'
      - 'tests/test_pi_training_export.py'
      - 'tests/test_pi_teams_export.py'
      - 'tests/test_pi_drive_attest.py'
      - '.github/workflows/test_public_sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publisher shell syntax
        run: bash -n scripts/pi_public_publish.sh
      - name: Check Google Apps Script editor
        run: node tests/test_apps_script.js
      - name: Run offline publication-safety tests
        run: python3 -m unittest discover -s tests -v
